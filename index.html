 g.lineJoin='round';g.miterLimit=2;g.strokeStyle=stroke;g.lineWidth=line;g.strokeText(label,x,y);
 g.fillStyle=color;g.fillText(label,x,y);
 g.restore();
}
function raidFrame(now){
 if(start<0||alertType!=='raid')return;
 const t=(now-start)/1000,T=8.5;
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);
 if(t>=T){raidTrack.pause();raidTrack.currentTime=0;start=-1;testButtons.forEach(btn=>btn.disabled=false);return}
 requestAnimationFrame(raidFrame);
 raidTrack.volume=muted?0:.10*(1-raidEase((t-7.0)/1.3));
 const s=Math.min(c.width/1100,c.height/560);g.translate((c.width-1100*s)/2,(c.height-560*s)/2);g.scale(s,s);
 g.translate(440,210);g.scale(.56,.56);
 const intro=raidEase(t/.75),hold=1-raidEase((t-7.1)/1.25),alpha=intro*hold;
 g.save();g.globalAlpha=alpha;
 // Left-bottom crystal mass only; gameplay stays visible.
 const crystalX=-30+(1-intro)*-120, crystalY=240+(1-intro)*40;
 g.save();g.globalAlpha*=.92;g.drawImage(raidBg,crystalX,crystalY,520,300);g.restore();
 // Aura and sparks around the crystals.
 const coreX=238,coreY=372;
 glow(coreX,coreY,150,'#ff7a1f44',alpha*.9);
 glow(coreX+55,coreY-48,120,'#bf56ff3a',alpha*.9);
 for(let i=0;i<34;i++){
  const p=(t*1.6+i*0.13)%1,a=i*2.399963,rad=40+p*(100+i%3*26),x=coreX+Math.cos(a)*rad*.95,y=coreY+Math.sin(a)*rad*.62-p*65;
  ember(x,y,1.1+(i%4)*.65,1-p,(1-p)*alpha,73+i,p);
 }
 // Main avatar enters from the right, compact and off-center.
 if(raidAvatarMain.complete&&raidAvatarMain.naturalWidth){
  const a=raidEase((t-.45)/1.1),x=raidMix(1160,725,a),y=raidMix(628,188,a),w=280,h=420;
  g.save();g.globalAlpha*=a;g.translate(x,y+Math.sin(t*2.2)*2);g.shadowColor='#ff7a25';g.shadowBlur=16;g.drawImage(raidAvatarMain,0,0,w,h);g.restore();
 }
 // Secondary avatar cameo above the text, faint, so the raid has more identity variety.
 if(raidAvatarAlt.complete&&raidAvatarAlt.naturalWidth){
  const b=raidEase((t-1.05)/.85)*.78;
  g.save();g.globalAlpha*=b*.55;g.drawImage(raidAvatarAlt,500,16,188,171);g.restore();
 }
 // Compact text plate floating near the crystals, not full-screen.
 const plateIn=raidEase((t-1.05)/.65);
 g.save();g.globalAlpha*=plateIn;
 const px=410,py=245,pw=355,ph=170;
 const plate=g.createLinearGradient(px,py,px+pw,py+ph);
 plate.addColorStop(0,'rgba(18,8,24,.88)');plate.addColorStop(.52,'rgba(29,11,34,.84)');plate.addColorStop(1,'rgba(14,8,20,.78)');
 g.fillStyle=plate;g.beginPath();
 g.moveTo(px+18,py);g.lineTo(px+pw-44,py);g.lineTo(px+pw,py+34);g.lineTo(px+pw,py+ph-18);g.lineTo(px+pw-18,py+ph);g.lineTo(px+24,py+ph);g.lineTo(px,py+ph-26);g.lineTo(px,py+18);g.closePath();g.fill();
 g.strokeStyle='rgba(255,150,60,.75)';g.lineWidth=2;g.stroke();
 raidCompactText('RAID',438,281,20,'800','#ffd9a2','#2b120c',3);
 let fs=34;g.font='900 '+fs+'px "Trebuchet MS", Verdana, sans-serif';while(g.measureText(username).width>285&&fs>18){fs-=2;g.font='900 '+fs+'px "Trebuchet MS", Verdana, sans-serif';}
 raidCompactText(username,438,320,fs,'900','#ffffff','#1a0a10',5);
 const countLabel=bitAmount===null?'Tu comunidad llegó':(bitAmount===1?'1 espectador llegó':String(bitAmount)+' espectadores llegaron');
 raidCompactText(countLabel,438,366,22,'700','#f2a853','#250d08',3);
 raidCompactText('Gracias por traer la raid',438,403,18,'700','#e9ddff','#18081a',3);
 // accent shards
 g.fillStyle='rgba(191,86,255,.75)';g.beginPath();g.moveTo(734,255);g.lineTo(750,274);g.lineTo(730,291);g.lineTo(718,273);g.closePath();g.fill();
 g.fillStyle='rgba(255,122,31,.9)';g.beginPath();g.moveTo(424,250);g.lineTo(435,264);g.lineTo(420,279);g.lineTo(410,264);g.closePath();g.fill();
 g.restore();
 g.restore();
}
function startRaid(){
 backgroundMusic.pause();phoenixAudio.pause();followAudio.pause();clearTimeout(phoenixTimer);
 raidTrack.pause();raidTrack.currentTime=0;raidTrack.volume=.10;
 if(!muted)raidTrack.play().catch(e=>console.warn('[Raid audio]',e));
 requestAnimationFrame(raidFrame);
}
function play(name,type='follow',amount=null){bitAmount=amount!==null&&amount!==''&&Number.isSafeInteger(Number(amount))&&Number(amount)>0?Number(amount):null;alertType=Object.prototype.hasOwnProperty.call(alertLabels,type)?type:'follow';textBurnTiles=null;username=String(name||Q.get('name')||who.value||'NuevoSeguidor').slice(0,40);start=performance.now();testButtons.forEach(btn=>btn.disabled=true);if(alertType==='sub'){startSub();}else if(alertType==='raid'){startRaid();}else{sound();requestLegacyFrame();}}window.playFollow=play;b.onclick=()=>play(who.value);document.querySelector('#playSub').onclick=()=>{if(subArtReady())play(who.value,'sub');else if(!subArt.complete)subArt.addEventListener('load',()=>{if(start<0)play(who.value,'sub')},{once:true});};document.querySelector('#playBits').onclick=()=>play(who.value,'bits',30);document.querySelector('#playRaid').onclick=()=>play(who.value,'raid',20);let m=document.querySelector('#mute');function muteLabel(){m.textContent='Sonido: '+(muted?'no':'sí')}m.onclick=()=>{muted=!muted;subMusic.muted=muted;muteLabel()};muteLabel();const eventQueue=[];function drainAlerts(){if(!ready||start>=0||!eventQueue.length)return;if(eventQueue[0].type==='sub'&&!subArt.complete)return;const a=eventQueue.shift();play(a.name,a.type,a.amount);}window.addEventListener('message',e=>{if(e.source!==window.parent)return;const a=e.data;if(!a||!Object.prototype.hasOwnProperty.call(alertLabels,a.type))return;eventQueue.push({type:a.type,name:a.name,amount:a.amount});drainAlerts();});setInterval(drainAlerts,100);if(Q.has('autoplay')){let timer=setInterval(()=>{if(ready&&(Q.get('type')!=='sub'||subArt.complete)){clearInterval(timer);play(Q.get('name'),Q.get('type')||'follow',Q.get('amount'))}},50)}
</script></body></html>
