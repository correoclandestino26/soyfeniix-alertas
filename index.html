let mixBufferPromise,activeAudio=[];
function prepareMix(){
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  return mixBufferPromise||(mixBufferPromise=fetch(followAudio.src).then(r=>r.arrayBuffer()).then(a=>audio.decodeAudioData(a)));
}
function sound(){
  for(const src of activeAudio){try{src.stop()}catch(e){}}activeAudio=[];
  followAudio.pause();followAudio.currentTime=0;if(muted)return;
  try{
    const playTime=start;
    const promise=prepareMix();audio.resume().catch(()=>{});
    promise.then(buf=>{
      if(start!==playTime||muted)return;
      const offset=Math.max(0,(performance.now()-playTime)/1000),at=audio.currentTime+.012;
      if(offset>=buf.duration)return;
      const main=audio.createBufferSource(),gain=audio.createGain();main.buffer=buf;main.connect(gain).connect(audio.destination);
      const reduction=.80,releaseStart=3.25,releaseEnd=3.6;
      gain.gain.setValueAtTime(offset>=releaseEnd?1:offset<=releaseStart?reduction:reduction+(1-reduction)*(offset-releaseStart)/(releaseEnd-releaseStart),at);
      if(offset<releaseStart)gain.gain.setValueAtTime(reduction,at+releaseStart-offset);
      if(offset<releaseEnd)gain.gain.linearRampToValueAtTime(1,at+releaseEnd-offset);
      main.start(at,offset);activeAudio.push(main);
      // Reinforce the fire bed using the fire-only portion of the original recording mix.
      if(offset<releaseEnd&&buf.duration>7.4){
        const bed=audio.createBufferSource(),bedGain=audio.createGain();bed.buffer=buf;bed.connect(bedGain).connect(audio.destination);
        const dur=releaseEnd-offset,level=.48;
        bedGain.gain.setValueAtTime(0,at);
        bedGain.gain.linearRampToValueAtTime(level,at+Math.min(.22,dur*.25));
        bedGain.gain.setValueAtTime(level,at+Math.max(Math.min(.22,dur*.25),dur-.4));
        bedGain.gain.linearRampToValueAtTime(0,at+dur);
        bed.start(at,3.75+offset,dur);activeAudio.push(bed);
      }
    }).catch(()=>{followAudio.volume=.8;followAudio.play().catch(()=>{});});
  }catch(e){followAudio.volume=.8;followAudio.play().catch(()=>{});}
}
function play(name){username=String(name||Q.get('name')||who.value||'NuevoSeguidor').slice(0,40);start=performance.now();b.disabled=true;sound()}window.playFollow=play;b.onclick=()=>play(who.value);let m=document.querySelector('#mute');function muteLabel(){m.textContent='Sonido: '+(muted?'no':'sí')}m.onclick=()=>{muted=!muted;muteLabel()};muteLabel();window.addEventListener('message',e=>{if(e.data&&e.data.type==='follow')play(e.data.name)});if(Q.has('autoplay')){let timer=setInterval(()=>{if(ready){clearInterval(timer);play(Q.get('name'))}},50)}
