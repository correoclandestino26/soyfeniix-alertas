<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoyFeniix | Laboratorio de alertas</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090811;color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;display:grid;place-items:center;
}
main{width:min(95%,900px);text-align:center}
h1{color:#ff872e;letter-spacing:4px}
.stage{
 position:relative;aspect-ratio:16/9;
 background:radial-gradient(ellipse,#21122e,#08060e 75%);
 border:1px solid #55315b;border-radius:12px;
 overflow:hidden;
}
canvas{width:100%;height:100%;display:block}
.overlay{
 position:absolute;inset:0;
 display:grid;place-items:center;
 pointer-events:none;
}
.message{
 opacity:0;transform:scale(.6);
 transition:opacity .35s,transform .5s;
 font-size:clamp(22px,5vw,54px);
 font-weight:900;letter-spacing:3px;
 color:#fff0dd;
 text-shadow:0 0 12px #ff7400,
 0 0 35px #ff4500,0 0 65px #933cff;
}
.message.show{opacity:1;transform:scale(1)}
.subtitle{
 margin-top:15px;color:#ffad64;
 letter-spacing:4px;font-size:14px;
 opacity:0;transition:opacity .4s;
}
.subtitle.show{opacity:1}
button{
 margin:20px 7px;padding:14px 25px;
 background:#30152f;color:white;
 border:1px solid #ff852d;
 border-radius:8px;font-weight:bold;
 cursor:pointer;
}
button:hover{background:#642844}
p{color:#aaa}
</style>
</head>
<body>
<main>
<h1>SOYFENIIX</h1>
<p>Laboratorio de alertas</p>

<div class="stage">
<canvas id="effects"></canvas>
<div class="overlay">
<div>
<div class="message" id="message"></div>
<div class="subtitle" id="subtitle"></div>
</div>
</div>
</div>

<button onclick="play('follow')">FOLLOW</button>


<p>Prueba de alerta Follow</p>
</main>

<script>
const canvas=document.getElementById("effects");
const ctx=canvas.getContext("2d");
const message=document.getElementById("message");
const subtitle=document.getElementById("subtitle");

let w,h,particles=[],bolts=[],rings=[];
let start=0,active=false,runId=0;

function resize(){
 const r=canvas.getBoundingClientRect();
 w=canvas.width=Math.round(r.width*devicePixelRatio);
 h=canvas.height=Math.round(r.height*devicePixelRatio);
}
resize();
window.addEventListener("resize",resize);

function random(a,b){
 return a+Math.random()*(b-a);
}

function particle(){
 const angle=random(0,Math.PI*2);
 const radius=random(15,180)*w/900;
 return {
 x:w/2+Math.cos(angle)*radius,
 y:h/2+Math.sin(angle)*radius,
 vx:random(-2,2)*w/900,
 vy:random(-4,-.8)*h/506,
 life:random(30,90),
 max:90,
 size:random(.5,2.4)*w/900,
 color:Math.random()<.7?25:275
 };
}

function arcRing(){
 rings.push({radius:random(12,35)*w/900,life:35,max:35,angle:random(0,6.28)});
}

function lightning(){
 const angle=random(0,Math.PI*2);
 const radius=random(.25,.48)*Math.min(w,h);
 const sx=w/2+Math.cos(angle)*radius;
 const sy=h/2+Math.sin(angle)*radius;
 const ex=w/2+random(-60,60)*w/900;
 const ey=h/2+random(-40,40)*h/506;

 let points=[];
 for(let i=0;i<=12;i++){
  const t=i/12;
  points.push([
   sx+(ex-sx)*t+random(-20,20)*w/900,
   sy+(ey-sy)*t+random(-25,25)*h/506
  ]);
 }
 bolts.push({
  points:points,
  life:random(4,11),
  color:Math.random()<.5?25:275
 });
}

function animate(time){
 ctx.clearRect(0,0,w,h);

 if(active){
  const elapsed=time-start;
  const fade=Math.min(
   1,elapsed/500,
   Math.max(0,(6000-elapsed)/800)
  );

  const glow=ctx.createRadialGradient(
   w/2,h/2,0,w/2,h/2,w*.45
  );
  glow.addColorStop(0,
   "rgba(255,100,20,"+(.22*fade)+")");
  glow.addColorStop(.4,
   "rgba(140,40,220,"+(.13*fade)+")");
  glow.addColorStop(1,"transparent");

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,w,h);

  if(elapsed<5200){
   for(let i=0;i<9;i++)
    particles.push(particle());
   if(Math.random()<.68)lightning();
   if(Math.random()<.12)arcRing();
  }

  rings=rings.filter(r=>r.life-->0);
  for(const r of rings){
   r.radius+=5*w/900;
   const a=r.life/r.max*fade;
   ctx.beginPath();
   ctx.ellipse(w/2,h/2,r.radius,r.radius*.57,r.angle,0,Math.PI*2);
   ctx.strokeStyle='rgba(186,85,255,'+a*.55+')';
   ctx.lineWidth=2*w/900;
   ctx.shadowColor='#b34bff';ctx.shadowBlur=22*w/900;
   ctx.stroke();
  }
  particles=particles.filter(p=>p.life-->0);

  for(const p of particles){
   p.x+=p.vx;
   p.y+=p.vy;

   ctx.beginPath();
   ctx.fillStyle=
    `hsla(${p.color},100%,65%,${p.life/p.max*fade})`;
   ctx.shadowColor=
    `hsl(${p.color},100%,55%)`;
   ctx.shadowBlur=18*w/900;
   ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
   ctx.fill();
   ctx.beginPath();ctx.moveTo(p.x,p.y);
   ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3);
   ctx.lineWidth=Math.max(.5,p.size*.6);
   ctx.strokeStyle=ctx.fillStyle;ctx.stroke();
  }

  bolts=bolts.filter(b=>b.life-->0);

  for(const b of bolts){
   ctx.beginPath();
   b.points.forEach((p,i)=>{
    if(i===0)ctx.moveTo(p[0],p[1]);
    else ctx.lineTo(p[0],p[1]);
   });

   ctx.strokeStyle=
    `hsla(${b.color},100%,75%,${b.life/11*fade})`;
   ctx.lineWidth=2*w/900;
   ctx.shadowColor=
    b.color===25?"#ff7428":"#a353ff";
   ctx.shadowBlur=22*w/900;
   ctx.stroke();
   ctx.lineWidth=.65*w/900;
   ctx.strokeStyle='rgba(255,245,255,'+(b.life/11*fade*.85)+')';
   ctx.shadowBlur=4*w/900;ctx.stroke();
  }

  ctx.shadowBlur=0;

  if(elapsed>=6000){
   active=false;
   message.classList.remove("show");
   subtitle.classList.remove("show");
  }
 }

 requestAnimationFrame(animate);
}

function play(type){
 const id=++runId;
 particles=[];
 bolts=[];
 rings=[];
 active=true;
 start=performance.now();

 message.classList.remove("show");
 subtitle.classList.remove("show");

 const messages={follow:"¡NUEVO FOLLOW!"};

 message.textContent=messages[type];
 subtitle.textContent=
  "LA ENERGÍA DESPIERTA";

 setTimeout(()=>{
  if(id!==runId)return;
  message.classList.add("show");
  subtitle.classList.add("show");
 },650);

 setTimeout(()=>{
  if(id!==runId)return;
  message.classList.remove("show");
  subtitle.classList.remove("show");
 },4800);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
